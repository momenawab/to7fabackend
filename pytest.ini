[pytest]
DJANGO_SETTINGS_MODULE = to7fabackend.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = custom_auth/tests cart/tests orders/tests
addopts = -v --tb=short
# Skip tests that require third-party services (OTP/SMS, Redis)
filterwarnings =
    ignore::DeprecationWarning
